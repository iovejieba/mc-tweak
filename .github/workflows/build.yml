name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build libxml2-dev \
            libssl-dev zlib1g-dev xz-utils wget unzip

      - name: Download iOS SDK (iPhoneOS15.5.sdk)
        run: |
          set -eux
          # cctools-port 的预置 SDK；体积约 100MB
          wget -q "https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS15.5.sdk.zip" -O sdk.zip || \
          wget -q "https://github.com/theos/sdks/archive/refs/heads/master.zip" -O sdk.zip
          unzip -q sdk.zip
          ls -d *.sdk

      - name: Show SDK
        run: |
          set -eux
          SDK=$(ls -d *.sdk | head -1)
          echo "SDK=$SDK"
          echo "SDK=$(pwd)/$SDK" >> $GITHUB_ENV
          ls "$SDK" | head

      - name: Build dylib (arm64)
        run: |
          set -eux
          clang --version
          clang -arch arm64 \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -F"$SDK/System/Library/Frameworks" \
            -dynamiclib -fobjc-arc -O2 \
            -framework Foundation -framework Security \
            -o MemberBypass.dylib \
            src/MemberBypass.m || true
          ls -la MemberBypass.dylib || echo "build failed"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemberBypass-dylib
          path: MemberBypass.dylib
          retention-days: 7
          if-no-files-found: warn
