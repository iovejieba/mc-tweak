name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm wget unzip xz-utils file

      - name: Fetch iOS SDK
        run: |
          set -eux
          wget -q "https://github.com/theos/sdks/archive/refs/heads/master.zip" -O sdk.zip
          unzip -q sdk.zip
          SDK="$PWD/sdks-master/iPhoneOS16.5.sdk"
          test -d "$SDK/usr/include"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Build dylib
        run: |
          set -eux
          LD64=$(ls /usr/lib/llvm-*/bin/ld64.lld | head -1)
          printf '#!/bin/bash\nexec %s "$@"\n' "$LD64" > /tmp/ld64wrap
          chmod +x /tmp/ld64wrap
          clang -arch arm64 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -O2 \
            -fuse-ld=/tmp/ld64wrap \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-platform_version,ios,16.0,16.0 \
            -framework Foundation -framework Security \
            -o MemberBypass.dylib \
            src/MemberBypass.m src/Constructor.c
          file MemberBypass.dylib
          ls -la MemberBypass.dylib

      - name: Check dylib
        run: |
          pip install --quiet lief
          python3 check_dylib.py MemberBypass.dylib

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemberBypass-dylib
          path: MemberBypass.dylib
          retention-days: 7
          if-no-files-found: warn
