name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm wget unzip xz-utils file

      - name: Fetch iOS SDK
        run: |
          set -eux
          wget -q "https://github.com/theos/sdks/archive/refs/heads/master.zip" -O sdk.zip
          unzip -q sdk.zip
          SDK="$PWD/sdks-master/iPhoneOS16.5.sdk"
          test -d "$SDK/usr/include"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Build all variants
        run: |
          set -eux
          LD64=$(ls /usr/lib/llvm-*/bin/ld64.lld | head -1)
          printf '#!/bin/bash\nexec %s "$@"\n' "$LD64" > /tmp/ld64wrap
          chmod +x /tmp/ld64wrap

          CC="clang -arch arm64 -target arm64-apple-ios16.0 -isysroot $SDK \
              -dynamiclib -fobjc-arc -O2 -fuse-ld=/tmp/ld64wrap \
              -Wl,-undefined,dynamic_lookup -Wl,-platform_version,ios,16.0,16.0 \
              -framework Foundation -framework UIKit -framework Security"

          # 驼峰键名
          $CC -DVIPKEY_UNDERSCORE=0 -o MemberBypass_camel.dylib src/MemberBypass.m src/Constructor.c
          # 下划线键名
          $CC -DVIPKEY_UNDERSCORE=1 -o MemberBypass_uscore.dylib src/MemberBypass.m src/Constructor.c

          file MemberBypass_camel.dylib MemberBypass_uscore.dylib
          ls -la *.dylib

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dylibs
          path: |
            MemberBypass_camel.dylib
            MemberBypass_uscore.dylib
            Probe2.dylib
          retention-days: 7
          if-no-files-found: warn
