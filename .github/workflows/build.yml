name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm wget unzip xz-utils file

      - name: Fetch iOS SDK (iPhoneOS16.5)
        run: |
          set -eux
          wget -q "https://github.com/theos/sdks/archive/refs/heads/master.zip" -O sdk.zip
          unzip -q sdk.zip
          SDK=$(ls -d sdks-master/iPhoneOS16.5.sdk)
          echo "SDK=$PWD/$SDK" >> $GITHUB_ENV
          test -d "$SDK/usr/include"

      - name: Compile MemberBypass
        run: |
          set -eux
          LD64=$(ls /usr/lib/llvm-*/bin/ld64.lld | head -1)
          echo "LD64=$LD64"
          cat > link.sh <<'EOS'
          #!/bin/bash
          set -eu
          exec "$LD64" "$@"
          EOS
          chmod +x link.sh
          export LD64
          clang -arch arm64 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -O2 \
            -fuse-ld="$PWD/link.sh" \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-platform_version,ios,16.0,16.0 \
            -Wl,-init,_MBInit \
            -framework Foundation -framework Security \
            -o MemberBypass.dylib \
            src/MemberBypass.m
          file MemberBypass.dylib
          ls -la MemberBypass.dylib

      - name: Verify structure
        run: |
          set -eux
          pip install --quiet lief || true
          python - <<'EOF'
import lief, sys
b = lief.parse('MemberBypass.dylib')
sects = [s.name for s in b.sections]
print("sections:", sects)
print("libraries:", [l.name for l in b.libraries])
ok = True
if '__mod_init_func' not in sects:
    print("WARN: no __mod_init_func — -init must be present")
    cmds = [c.command.name for c in b.commands]
    print("has LC_ROUTINES_64:", any('ROUTINES' in c for c in cmds))
for need in ('_MBInit',):
    print(need, "exported:", need in b.exported_symbols)
EOF

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemberBypass-dylib
          path: MemberBypass.dylib
          retention-days: 7
          if-no-files-found: warn
