name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang wget unzip xz-utils file

      - name: Fetch iOS SDK
        run: |
          set -eux
          wget -q "https://github.com/theos/sdks/archive/refs/heads/master.zip" -O sdk.zip
          unzip -q sdk.zip
          ls -d sdks-master/*.sdk
          SDK=$(ls -d sdks-master/*.sdk | head -1)
          echo "SDK=$PWD/$SDK" >> $GITHUB_ENV
          du -sh "$SDK"

      - name: Build dylib
        run: |
          set -eux
          clang --version
          ls "$SDK/System/Library/Frameworks" | head -20

      - name: Compile MemberBypass
        run: |
          set -eux
          clang -arch arm64 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -F"$SDK/System/Library/Frameworks" \
            -dynamiclib -fobjc-arc -O2 \
            -Wl,-undefined,dynamic_lookup \
            -framework Foundation -framework Security \
            -o MemberBypass.dylib \
            src/MemberBypass.m
          file MemberBypass.dylib
          ls -la MemberBypass.dylib

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemberBypass-dylib
          path: MemberBypass.dylib
          retention-days: 7
          if-no-files-found: warn
