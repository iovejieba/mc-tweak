name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm wget unzip xz-utils file cmake ninja-build

      - name: Verify lld
        run: |
          which ld64.lld ld.lld lld || true
          ld64.lld --version || ld64.lld -v || true
          ls /usr/lib/llvm-*/bin/ | grep -i lld | head

      - name: Fetch iOS SDK (iPhoneOS16.5)
        run: |
          set -eux
          wget -q "https://github.com/theos/sdks/archive/refs/heads/master.zip" -O sdk.zip
          unzip -q sdk.zip
          ls -d sdks-master/iPhoneOS*.sdk
          SDK=$(ls -d sdks-master/iPhoneOS16.5.sdk)
          echo "SDK=$PWD/$SDK" >> $GITHUB_ENV
          test -d "$SDK/usr/include"

      - name: Compile MemberBypass
        run: |
          set -eux
          export LD64_LLD=$(ls /usr/lib/llvm-*/bin/ld64.lld | head -1)
          echo "using $LD64_LLD"
          clang -arch arm64 -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -F"$SDK/System/Library/Frameworks" \
            -dynamiclib -fobjc-arc -O2 \
            -fuse-ld="$LD64_LLD" \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-platform_version,ios,16.0,16.0 \
            -framework Foundation -framework Security \
            -o MemberBypass.dylib \
            src/MemberBypass.m
          file MemberBypass.dylib
          ls -la MemberBypass.dylib

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemberBypass-dylib
          path: MemberBypass.dylib
          retention-days: 7
          if-no-files-found: warn
